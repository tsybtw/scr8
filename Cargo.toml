[package]
name = "scr8"
version = "1.4.1"
description = "Instant region screenshots bound to global hotkeys"
license = "MIT"
rust-version = "1.98"
edition = "2024"

[features]
# Scripted check run by CI (see ci/). Not part of release builds.
selftest = []

[dependencies]
auto-launch = "0.6.0"
chrono = "0.4.45"
crc32fast = "1.5.2"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "wgpu", "default_fonts"] }
# Pure-Rust zlib-rs backend makes the Balanced/Best PNG levels ~2.5x faster.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
global-hotkey = "0.8.0"
png = "0.18.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
simd-adler32 = "0.3.10"
tray-icon = "0.25.1"

[target.'cfg(windows)'.dependencies]
# The egui fonts, so the Windows area picker (drawn with GDI) matches the UI.
epaint_default_fonts = "0.36.2"
# Direct3D / DXGI for fast capture with Desktop Duplication.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Keep PNG encoding fast in debug builds too.
[profile.dev.package."*"]
opt-level = 3

# Embeds the icon and version info into scr8.exe.
[target.'cfg(windows)'.build-dependencies]
png = "0.18.1"
winresource = "0.1.31"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
