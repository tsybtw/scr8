name: build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - run: Copy-Item target/release/scr8.exe scr8-windows.exe
      - uses: actions/upload-artifact@v7
        with:
          name: scr8-windows
          path: scr8-windows.exe
      # Runs a test build on this real Windows machine and keeps screenshots.
      # Built separately: the self-test code isn't in the release.
      - run: cargo build --release --features selftest --target-dir target/selftest
      - name: Self-test
        continue-on-error: true
        run: ./ci/selftest.ps1 -Exe target/selftest/release/scr8.exe -Out selftest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selftest-windows
          path: selftest

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: ./macos/bundle.sh
      - uses: actions/upload-artifact@v7
        with:
          name: scr8-macos
          path: target/scr8-macos.dmg
      # Runs a test build on this real Mac and keeps screenshots.
      # Built separately: the self-test code isn't in the release.
      - name: Test build
        run: |
          cargo build --release --features selftest --target-dir target/selftest
          rm -rf target/scr8-selftest.app
          cp -R target/scr8.app target/scr8-selftest.app
          cp target/selftest/release/scr8 target/scr8-selftest.app/Contents/MacOS/scr8
          codesign --force --deep --sign - target/scr8-selftest.app
      - name: Self-test
        continue-on-error: true
        run: bash ci/selftest.sh target/scr8-selftest.app selftest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selftest-macos
          path: selftest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            scr8-windows.exe
            scr8-macos.dmg
